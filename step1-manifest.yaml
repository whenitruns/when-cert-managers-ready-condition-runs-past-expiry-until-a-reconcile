apiVersion: v1
kind: Namespace
metadata:
  name: rr10
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
  namespace: rr10
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-a
  namespace: rr10
spec:
  secretName: cert-a-tls
  duration: 1h
  renewBefore: 55m
  dnsNames:
    - cert-a.rr10.example.test
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: selfsigned
    kind: Issuer
